<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1分でできる宿曜占星術</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input[type="date"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="date"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab-button {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #999;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            width: auto;
        }

        .tab-button.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }

        .result.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-title {
            font-size: 24px;
            color: #667eea;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .result-description {
            color: #555;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            color: #667eea;
            font-weight: 700;
            margin-top: 20px;
            margin-bottom: 12px;
        }

        .detailed-description {
            color: #555;
            font-size: 14px;
            line-height: 1.8;
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .result-properties {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .property {
            background: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
        }

        .property-label {
            color: #999;
            font-size: 12px;
            margin-bottom: 4px;
        }

        .property-value {
            color: #333;
            font-weight: 600;
        }

        .lucky-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 12px;
        }

        .lucky-item {
            background: white;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .lucky-label {
            color: #999;
            font-size: 12px;
        }

        .lucky-value {
            font-weight: 600;
            font-size: 16px;
            color: #333;
        }

        .error {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            text-align: center;
            display: none;
        }

        .error.show {
            display: block;
        }

        .compatibility-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            margin-top: 20px;
            text-align: center;
        }

        .person {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
        }

        .person h3 {
            color: #667eea;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .person p {
            color: #999;
            font-size: 12px;
        }

        .compatibility-score {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .score-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: conic-gradient(#667eea calc(var(--score) * 3.6deg), #e0e0e0 0deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score-text {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 20px;
            color: #667eea;
        }

        .compatibility-score p {
            color: #667eea;
            font-weight: 600;
            margin: 0;
        }

        .compatibility-details {
            margin-top: 30px;
        }

        .detail-section {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
        }

        .detail-section h4 {
            color: #667eea;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .detail-section p {
            color: #555;
            line-height: 1.8;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .detail-section p:last-child {
            margin-bottom: 0;
        }

        .detail-section ul {
            margin-left: 20px;
            color: #555;
            line-height: 1.8;
            font-size: 14px;
        }

        .detail-section li {
            margin-bottom: 8px;
        }

        .advice-section {
            background: linear-gradient(135deg, #f8f9fa 0%, #efe8fc 100%);
            border-left-color: #764ba2;
        }

        .advice-section h4 {
            color: #764ba2;
        }

        strong {
            color: #667eea;
            font-weight: 600;
        }

        .analysis-section {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 12px;
            border-left: 3px solid #667eea;
        }

        .analysis-section h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .analysis-section p {
            color: #555;
            font-size: 13px;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ 宿曜占星術</h1>
        <p class="subtitle">生年月日から運命の宿を占う</p>

        <div class="tabs">
            <button class="tab-button active" data-tab="divination">占う</button>
            <button class="tab-button" data-tab="compatibility">相性診断</button>
        </div>

        <div id="divination" class="tab-content active">
            <form id="form">
                <div class="form-group">
                    <label for="birthdate">生年月日を入力</label>
                    <input type="date" id="birthdate" required>
                </div>
                <button type="submit">占う</button>
            </form>

            <div class="error" id="error"></div>

            <div class="result" id="result">
                <div class="result-title" id="resultTitle"></div>
                <div class="result-description" id="resultDescription"></div>

                <div class="section-title">詳しい説明</div>
                <div class="detailed-description" id="detailedDescription"></div>

                <div class="section-title">基本情報</div>
                <div class="result-properties" id="resultProperties"></div>

                <div class="section-title">ラッキー情報</div>
                <div class="lucky-info" id="luckyInfo"></div>

                <div id="analysisContainer"></div>
            </div>
        </div>

        <div id="compatibility" class="tab-content">
            <form id="compatibilityForm">
                <div class="form-group">
                    <label for="birthdate1">1人目の生年月日</label>
                    <input type="date" id="birthdate1" required>
                </div>
                <div class="form-group">
                    <label for="birthdate2">2人目の生年月日</label>
                    <input type="date" id="birthdate2" required>
                </div>
                <button type="submit">相性を診断</button>
            </form>

            <div class="error" id="compatibilityError"></div>

            <div class="result" id="compatibilityResult">
                <div class="section-title">相性診断結果</div>
                <div id="compatibilityResultContent"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // タブ切り替え
        document.querySelectorAll('.tab-button').forEach(button => {
            button.addEventListener('click', () => {
                const tabName = button.getAttribute('data-tab');

                document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

                button.classList.add('active');
                document.getElementById(tabName).classList.add('active');
            });
        });
    </script>
</body>
</html>
